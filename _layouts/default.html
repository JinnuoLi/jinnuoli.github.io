<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
  <meta name="author" content="{{ site.title | escape }}">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <style id="highlight_theme_light">.bibtex pre { color-scheme: light; }</style>
  <style id="highlight_theme_dark" media="none">.bibtex pre { color-scheme: dark; }</style>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script>initTheme();</script>
  <script defer src="{{ '/assets/js/nav-toggle.js' | relative_url }}"></script>
  <noscript><style>#light-toggle, .navbar-toggler { display: none; } #navbarNav { display: flex; }</style></noscript>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header class="site-header">
    <nav class="navbar navbar-light navbar-expand-sm" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}"><strong>Jinnuo</strong> Li</a>
        <button class="navbar-toggler collapsed navbar-toggler-main" type="button" data-nav-toggle="navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="icon-bar top-bar"></span><span class="icon-bar middle-bar"></span><span class="icon-bar bottom-bar"></span>
        </button>
        <div class="collapse navbar-collapse navbar-collapse-main" id="navbarNav">
          <ul class="navbar-nav navbar-menu-list flex-nowrap">
            {%- assign nav_pages = site.pages | where_exp: 'p', 'p.nav_order != nil' | sort: 'nav_order' %}
            {%- for item in nav_pages %}
              <li class="nav-item{% if page.url == item.url %} active{% endif %}">
                <a class="nav-link" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | downcase }}</a>
              </li>
            {%- endfor %}
            <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}#misc">security reports</a></li>
            <li class="toggle-container">
              <button id="light-toggle" type="button" title="Change color theme" aria-label="Change color theme">
                <svg id="light-toggle-system" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
                <svg id="light-toggle-light" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
                <svg id="light-toggle-dark" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.5 14a8.7 8.7 0 0 1-10.6-11 9 9 0 1 0 10.6 11z"/></svg>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main id="main-content" class="container site-content" tabindex="-1">
    <div class="post">
      {{ content }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">© {{ site.title }} <span aria-hidden="true">·</span> <a href="https://github.com/alshedivat/al-folio">al-folio</a></div>
  </footer>
</body>
</html>
